services:
  mitmproxy:
    image: mitmproxy/mitmproxy
    command: mitmweb --web-host 0.0.0.0 --set web_password=1234
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - sandbox_net
    volumes:
      - ./traffic_logs:/home/mitmproxy

  chrome:
    image: selenium/standalone-chrome
    shm_size: "2gb"
    ports:
      - "4444:4444"
      - "7900:7900"
    dns:
      - 1.1.1.1
    networks:
      - sandbox_net
    depends_on:
      - mitmproxy

  runner:
    image: python:3.9-slim
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - sandbox_net
    command: tail -f /dev/null

networks:
  sandbox_net:
    driver: bridge